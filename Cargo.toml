[package]
name = "nt-rewrite"
version = "0.1.0"
edition = "2024"
description = "Nuclear Throne recreation on repame + repose (no bevy)"

[dependencies]
# Engine, from crates.io: every repame-* comes from the one published line.
repame-sim = "0.3.35"
repame-shell = "0.3.35"
repame-anim = "0.3.35"
repame-view2d = "0.3.35"
repame-atlas = "0.3.35"
repame-fx = "0.3.35"
repame-input = "0.3.35"
repame-audio = "0.3.35"
# PNG decode for atlas uploads (repame ships no image dep; games decode
# their own pixels per repame-atlas docs). Pinned to the cached 0.25 line.
image = "0.25"
# Direct dep: bevy derive macros expand to `bevy_ecs::` paths, so every
# game crate names it explicitly. Must unify with repame-sim's 0.20.
bevy_ecs = "0.20"
# Same glam as repame: shared math types must unify to one version.
glam = "0.33"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ron = "0.12"
game-utils = "0.4"
# Seeded RNG for sim decisions.
rand = "0.10"
repose-core = "0.31"
repose-ui = "0.31"
repose-canvas = "0.31"
repose-render-wgpu = "0.31"
# Direct dep for the in-crate vortex background pass (`vortex_pass.rs`
# implements `repose_render_wgpu::WgpuCallback`; must unify with its 30).
wgpu = "30"
repose-text = "0.31"
anyhow = "1"
log = "0.4"
zip = { version = "9", default-features = false, features = ["deflate"] }
web-time = "1"

[target.'cfg(target_os = "android")'.dependencies]
winit = "0.30"
ndk = "0.9"
rlobkit-app-events = { version = "0.5", features = ["jni-bridge"] }

# Local clock for the date-gated events (`date_part.rs`); the wasm build
# resolves UTC by hand instead (no tz database there).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
jiff = "0.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
getrandom = { version = "0.4", features = ["wasm_js"] }

[lib]
name = "nt_rewrite"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "nt-rewrite"
path = "src/main.rs"

[package.metadata.android]
package = "org.mlm.nt"
apk_name = "nt"
build_targets = ["aarch64-linux-android"]
assets = "packaging/assets"
resources = "packaging/res"

[package.metadata.android.application]
label = "Nuclear Throne"
icon = "@mipmap/ic_launcher"

[[package.metadata.android.application.activity]]
name = "rust.rlobkit.RlobKitMainActivity"
exported = true
launch_mode = "singleTask"

[[package.metadata.android.application.activity.intent_filter]]
actions = ["android.intent.action.MAIN"]
categories = ["android.intent.category.LAUNCHER"]

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 35

[dev-dependencies]
insta = "1.44.1"
repame-input = "0.3.35"
# (empty: offscreen pixel proofs use the main `repose-render-wgpu` dep,
# same pattern as repame-sprite's own batch tests).

[profile.dev]
opt-level = 1
