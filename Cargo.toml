[package]
name = "nt-rewrite"
version = "0.1.0"
edition = "2024"
description = "Nuclear Throne recreation on repame + repose (no bevy)"

[dependencies]
# Engine (path deps while co-evolving; versions match repame workspace).
repame-sim = { path = "../Repos/repame/crates/repame-sim", version = "0.2" }
repame-shell = { path = "../Repos/repame/crates/repame-shell", version = "0.2" }
repame-anim = { path = "../Repos/repame/crates/repame-anim", version = "0.2" }
repame-sprite = { path = "../Repos/repame/crates/repame-sprite", version = "0.2" }
repame-atlas = { path = "../Repos/repame/crates/repame-atlas", version = "0.2" }
repame-fx = { path = "../Repos/repame/crates/repame-fx", version = "0.2" }
repame-input = { path = "../Repos/repame/crates/repame-input", version = "0.2" }
repame-audio = { path = "../Repos/repame/crates/repame-audio", version = "0.2" }
# PNG decode for atlas uploads (repame ships no image dep; games decode
# their own pixels per repame-atlas docs). Pinned to the cached 0.25 line.
image = "0.25"
# Direct dep: bevy derive macros expand to `bevy_ecs::` paths, so every
# game crate names it explicitly. Must unify with repame-sim's 0.19.
bevy_ecs = "0.19"
# Same glam as repame: shared math types must unify to one version.
glam = "0.33"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Seeded RNG for sim decisions (same crate+version as the bevy build).
rand = "0.10"
repose-core = { path = "../Repos/repose/crates/repose-core", version = "0.30" }
repose-ui = { path = "../Repos/repose/crates/repose-ui", version = "0.30" }
repose-canvas = { path = "../Repos/repose/crates/repose-canvas", version = "0.30" }
repose-render-wgpu = { path = "../Repos/repose/crates/repose-render-wgpu", version = "0.30" }
# Direct dep for the in-crate vortex background pass (`vortex_pass.rs`
# implements `repose_render_wgpu::WgpuCallback`; must unify with its 30).
wgpu = "30"
repose-text = { path = "../Repos/repose/crates/repose-text", version = "0.30" }
anyhow = "1"
log = "0.4"

[target.'cfg(target_os = "android")'.dependencies]
winit = "0.30"
ndk = "0.9"

[patch.crates-io]
repose-core = { path = "../Repos/repose/crates/repose-core" }
repose-ui = { path = "../Repos/repose/crates/repose-ui" }
repose-canvas = { path = "../Repos/repose/crates/repose-canvas" }
repose-render-wgpu = { path = "../Repos/repose/crates/repose-render-wgpu" }
repose-text = { path = "../Repos/repose/crates/repose-text" }
repose-app = { path = "../Repos/repose/crates/repose-app" }
repose-platform = { path = "../Repos/repose/crates/repose-platform" }
repose-tree = { path = "../Repos/repose/crates/repose-tree" }
repose-devtools = { path = "../Repos/repose/crates/repose-devtools" }
repose-navigation = { path = "../Repos/repose/crates/repose-navigation" }
repose-material = { path = "../Repos/repose/crates/repose-material" }
repose-docking = { path = "../Repos/repose/crates/repose-docking" }
repose-macros = { path = "../Repos/repose/crates/repose-macros" }

[lib]
name = "nt_rewrite"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "nt-rewrite"
path = "src/main.rs"

[package.metadata.android]
package = "org.mlm.nt"
apk_name = "nt"
build_targets = ["aarch64-linux-android"]
assets = "packaging/assets"
resources = "packaging/res"

[package.metadata.android.application]
label = "Nuclear Throne"
icon = "@mipmap/ic_launcher"

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 35

[dev-dependencies]
insta = "1.44.1"
repame-input = { path = "../Repos/repame/crates/repame-input", version = "0.2" }
# (empty: offscreen pixel proofs use the main `repose-render-wgpu` dep,
# same pattern as repame-sprite's own batch tests).

[profile.dev]
opt-level = 1
