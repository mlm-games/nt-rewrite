<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>assets</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: #0b0d12;
    color: #e8e6df;
    font-family: "Courier New", monospace;
  }
  main { width: min(560px, 90vw); text-align: center; }
  h1 {
    margin: 0 0 6px;
    font-size: clamp(28px, 6vw, 44px);
    letter-spacing: 0.12em;
    color: #f4d35e;
    text-transform: uppercase;
  }
  .sub { margin: 0 0 28px; color: #8b8f9a; font-size: 14px; }
  #drop {
    border: 2px dashed #3d4354;
    border-radius: 10px;
    padding: 54px 24px;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
    background: #12151d;
  }
  #drop.over { border-color: #f4d35e; background: #191d28; }
  #drop strong { display: block; font-size: 18px; margin-bottom: 8px; }
  #drop span { color: #8b8f9a; font-size: 13px; }
  #play {
    display: block;
    width: 100%;
    padding: 20px;
    font: inherit;
    font-size: 20px;
    letter-spacing: 0.1em;
    color: #0b0d12;
    background: #f4d35e;
    border: 0;
    border-radius: 10px;
    cursor: pointer;
    text-transform: uppercase;
  }
  #play:hover { background: #ffe27a; }
  #status { min-height: 20px; margin: 18px 0 0; font-size: 13px; color: #8b8f9a; }
  #status.err { color: #ff6b6b; }
  #replace { margin-top: 14px; font-size: 13px; color: #8b8f9a; background: none; border: 0; cursor: pointer; text-decoration: underline; }
  #replace:hover { color: #e8e6df; }
</style>
</head>
<body>
<main>
  <h1>NT</h1>
  <p class="sub">drop your assets zip</p>
  <div id="drop" tabindex="0">
    <strong>Drop your assets zip here</strong>
    <span>or click to browse (the packaging/assets folder, zipped)</span>
  </div>
  <button id="play" hidden>▶ Play</button>
  <p id="status"></p>
  <button id="replace" hidden>use different assets (folder zip)</button>
  <input type="file" id="file" accept=".zip,application/zip" hidden>
</main>
<script>
  const DB = "nt-rewrite";
  const STORE = "assets";
  const KEY = "zip";
  const drop = document.getElementById("drop");
  const play = document.getElementById("play");
  const replace = document.getElementById("replace");
  const status = document.getElementById("status");
  const fileInput = document.getElementById("file");

  function openDb() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(DB, 1);
      req.onupgradeneeded = () => req.result.createObjectStore(STORE);
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  function readZip() {
    return openDb().then((db) => new Promise((resolve, reject) => {
      const tx = db.transaction(STORE, "readonly");
      const req = tx.objectStore(STORE).get(KEY);
      req.onsuccess = () => { db.close(); resolve(req.result || null); };
      req.onerror = () => { db.close(); reject(req.error); };
    }));
  }

  function writeZip(buffer) {
    return openDb().then((db) => new Promise((resolve, reject) => {
      const tx = db.transaction(STORE, "readwrite");
      tx.objectStore(STORE).put(buffer, KEY);
      tx.oncomplete = () => { db.close(); resolve(); };
      tx.onerror = () => { db.close(); reject(tx.error); };
      tx.onabort = () => { db.close(); reject(tx.error); };
    }));
  }

  function report(message, failed) {
    status.textContent = message;
    status.classList.toggle("err", !!failed);
  }

  function showStored() {
    drop.hidden = true;
    play.hidden = false;
    replace.hidden = false;
    report("assets found", false);
  }

  async function accept(file) {
    if (!file) return;
    if (!file.name.toLowerCase().endsWith(".zip")) {
      report("that is not a zip file", true);
      return;
    }
    report(`storing ${(file.size / 1048576).toFixed(1)} MB…`, false);
    drop.classList.add("over");
    try {
      await writeZip(await file.arrayBuffer());
      report("assets stored, starting…", false);
      location.href = "./game.html";
    } catch (e) {
      report(`could not store assets: ${e && e.message ? e.message : e}`, true);
    } finally {
      drop.classList.remove("over");
    }
  }

  drop.addEventListener("click", () => fileInput.click());
  fileInput.addEventListener("change", () => accept(fileInput.files[0]));
  for (const type of ["dragenter", "dragover"]) {
    document.addEventListener(type, (e) => {
      e.preventDefault();
      drop.classList.add("over");
    });
  }
  for (const type of ["dragleave", "drop"]) {
    document.addEventListener(type, (e) => {
      e.preventDefault();
      drop.classList.remove("over");
    });
  }
  document.addEventListener("drop", (e) => accept(e.dataTransfer && e.dataTransfer.files[0]));
  play.addEventListener("click", () => { location.href = "./game.html"; });
  replace.addEventListener("click", () => fileInput.click());

  readZip()
    .then((stored) => { if (stored) showStored(); })
    .catch(() => {});
</script>
</body>
</html>
