<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nuclear Throne</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #0b0d12; overflow: hidden; }
  canvas { display: block; }
  #boot {
    position: fixed;
    inset: 0;
    display: grid;
    place-content: center;
    gap: 14px;
    text-align: center;
    background: #0b0d12;
    color: #e8e6df;
    font-family: "Courier New", monospace;
    z-index: 10;
  }
  #boot.hidden { display: none; }
  #boot-msg { font-size: 15px; color: #8b8f9a; max-width: 70vw; }
  #boot.failed #boot-msg { color: #ff6b6b; }
  #boot-back {
    font: inherit;
    font-size: 15px;
    padding: 10px 18px;
    color: #0b0d12;
    background: #f4d35fe6;
    border: 0;
    border-radius: 8px;
    cursor: pointer;
  }
  #boot-back:hover { background: #ffe27a; }
</style>
</head>
<body>
<div id="boot">
  <div id="boot-msg">loading…</div>
  <button id="boot-back" hidden onclick="location.href='./'">back to start</button>
</div>
<script>
  window.__ntAssetsPromise = new Promise((resolve) => {
    try {
      const req = indexedDB.open("nt-rewrite", 1);
      req.onupgradeneeded = () => req.result.createObjectStore("assets");
      req.onsuccess = () => {
        const db = req.result;
        let tx;
        try {
          tx = db.transaction("assets", "readonly");
        } catch (e) {
          db.close();
          resolve(null);
          return;
        }
        const get = tx.objectStore("assets").get("zip");
        get.onsuccess = () => { db.close(); resolve(get.result || null); };
        get.onerror = () => { db.close(); resolve(null); };
      };
      req.onerror = () => resolve(null);
    } catch (e) {
      resolve(null);
    }
  });

  window.__ntBootStatus = function (message, failed) {
    const boot = document.getElementById("boot");
    if (message === "ready") {
      boot.classList.add("hidden");
      return;
    }
    boot.classList.remove("hidden");
    boot.classList.toggle("failed", !!failed);
    document.getElementById("boot-msg").textContent = message;
    document.getElementById("boot-back").hidden = !failed;
  };
</script>
<link data-trunk rel="rust" href="../Cargo.toml" data-target-name="nt_rewrite" />
</body>
</html>
